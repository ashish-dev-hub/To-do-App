<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List - Version 1</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="todo-app">
    <header class="app-header">
      <h1>My To-Do List</h1>
      <p class="subtitle"> Add, Complete & Delete</p>
    </header>

    <form id="task-form" class="task-form">
      <input type="text" id="task-input" placeholder="What do you need to do?" autocomplete="off" required />
      <button type="submit" id="add-btn">Add Task</button>
    </form>

    <main class="task-container">
      <ul id="task-list" class="task-list">
      </ul>

      <p id="empty-state" class="empty-state">No tasks yet so add a task above</p>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
