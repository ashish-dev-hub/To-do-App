<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="todo-app">
    <header class="app-header">
      <h1>TaskFlow</h1>
      <p class="subtitle">Keep track of your tasks, priorities, and daily progress</p>
    </header>

    <section class="stats-card" aria-label="Task progress statistics">
      <div class="stats-header">
        <div class="stats-info">
          <span class="stats-label">Task Progress</span>
          <span id="progress-percent" class="stats-percent">0%</span>
        </div>
        <span id="task-counter" class="task-counter">0 of 0 completed</span>
      </div>
      <div class="progress-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
    </section>

    <form id="task-form" class="task-form">
      <div class="input-wrapper">
        <input type="text" id="task-input" placeholder="What do you need to accomplish?" autocomplete="off" required maxlength="140"/>
      </div>
      <button type="submit" id="add-btn" class="primary-btn">
        <svg viewBox="0 0 20 20" fill="currentColor" class="btn-icon">
          <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
        </svg>
        <span>Add</span>
      </button>
    </form>

    <section class="controls-section" aria-label="Task search and filters">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
        </svg>
        <input type="text" id="search-input" placeholder="Search tasks..." autocomplete="off" aria-label="Search tasks"/>
        <button type="button" id="clear-search-btn" class="clear-search-btn" title="Clear search" aria-label="Clear search">
          &times;
        </button>
      </div>

      <div class="filter-tabs" role="tablist" aria-label="Filter tasks">
        <button type="button" class="filter-tab active" data-filter="all" role="tab" aria-selected="true">
          All <span class="tab-badge" id="count-all">0</span>
        </button>
        <button type="button" class="filter-tab" data-filter="active" role="tab" aria-selected="false">
          Active <span class="tab-badge" id="count-active">0</span>
        </button>
        <button type="button" class="filter-tab" data-filter="completed" role="tab" aria-selected="false">
          Done <span class="tab-badge" id="count-completed">0</span>
        </button>
      </div>
    </section>

    <main class="task-container">
      <ul id="task-list" class="task-list" aria-live="polite"></ul>

      <div id="empty-state" class="state-message">
        <h3>No tasks yet</h3>
        <p>Type your task above and click <strong>Add</strong> to get started.</p>
      </div>

      <div id="no-results-state" class="state-message" style="display: none;">
        <h3>No matching tasks</h3>
        <p>Try adjusting your search query or filter criteria.</p>
      </div>
    </main>

    <footer class="app-footer">
      <span id="active-tasks-summary" class="footer-summary">0 tasks remaining</span>
      <button type="button" id="clear-completed-btn" class="clear-completed-btn">
        Clear Completed
      </button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
